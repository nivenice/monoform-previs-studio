appId: com.monoform.previs
productName: MONOFORM
directories:
  output: release
# Reuse the Electron runtime already installed by npm instead of downloading
# another ~140 MB copy during packaging.
electronDist: node_modules/electron/dist
# Keep the committed installer under GitHub's 100 MiB per-file limit.
compression: maximum
electronLanguages:
  - zh-CN
  - en-US
files:
  - out/**/*
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
